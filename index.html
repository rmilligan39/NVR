        e.target.tagName, String(e.target.src || e.target.href || ''));

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin

    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https

    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error

    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;

        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

        }
        if (isPageRoot || window.parent === window) return; // authoritative miss

          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();

            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

          return;
        }

            (entry.compressed ? toBase64(finalBytes) : entry.data);

          const blob = new Blob([finalBytes], { type: entry.mime });

        console.error('Failed to decode asset ' + uuid + ':', err);

        resourceBlobs[blobUrls[uuid]] = blob;

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

r:1px solid #3a424e;white-space:nowrap;pointer-events:none;display:flex;gap:10px;align-items:center}\n.banner i{width:8px;height:8px;border-radius:50%}\n@media (max-width:1100px){\n .app{grid-template-columns:1fr;grid-template-rows:auto 70vh auto auto;height:auto}\n .left{order:0;border-right:0;max-height:none}.feed{max-height:320px}\n .stage{order:1}.bottom{order:2;position:sticky;bottom:0;z-index:4}.right{order:3;border-left:0}\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div class=\"app\">\n  <aside class=\"left\">\n    <div class=\"sec\">\n      <div class=\"eyebrow\">Incident EX1550543 · MO1550821<\u002Fdiv>\n      <h1>Microsoft 365 / Exchange Online global outage<\u002Fh1>\n      <p class=\"sub\">Thu 12 – Sat 14 Nov 2026. Mailbox access failed in the Americas, then cascaded to dependent services and regions worldwide. Resolved 04:17 UTC Sat 14 Nov; preliminary post-incident report published 15 Nov.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"sec\">\n      <div class=\"eyebrow\">Replay time<\u002Fdiv>\n      <div class=\"clock\" id=\"clock\">—<\u002Fdiv>\n      <div class=\"clock2\"><span id=\"clockEt\">—<\u002Fspan><span id=\"clockRel\">—<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"sec\" style=\"padding-bottom:10px;border-bottom:0\"><div class=\"eyebrow\">Event log · newest first<\u002Fdiv><\u002Fdiv>\n    <div class=\"feed\" id=\"feed\"><\u002Fdiv>\n  <\u002Faside>\n\n  <main class=\"stage\" id=\"stage\">\n    <canvas id=\"globe\"><\u002Fcanvas>\n    <div class=\"banner\" id=\"banner\"><i><\u002Fi><span><\u002Fspan><\u002Fdiv>\n    <div class=\"overlay\">\n      <div class=\"legend\">\n        <span><b style=\"background:var(--out);height:8px;width:8px;border-radius:50%\"><\u002Fb>User impact reported<\u002Fspan>\n        <span><b style=\"background:var(--rec);height:8px;width:8px;border-radius:50%\"><\u002Fb>Recovering<\u002Fspan>\n        <span><b style=\"background:var(--out);height:8px;width:8px\"><\u002Fb>Exchange site dark<\u002Fspan>\n        <span><b style=\"background:var(--amb);height:8px;width:8px\"><\u002Fb>Absorbing load / partial<\u002Fspan>\n        <span><b style=\"background:var(--rec);height:8px;width:8px\"><\u002Fb>Site traffic back<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"hint\">Drag to rotate · scroll to zoom · click markers<br>Space play/pause · ←/→ step events<\u002Fdiv>\n    <div id=\"tip\"><\u002Fdiv>\n  <\u002Fmain>\n\n  <aside class=\"right\">\n    <div class=\"sec\">\n      <div class=\"eyebrow\">Exchange Online mail volume<\u002Fdiv>\n      <p class=\"sub\" style=\"margin-top:6px\">Traffic and client connections vs. expected levels (same time prior day). Deficit = mail not sent/received; surplus = queued mail landing.<\u002Fp>\n      <div id=\"chart\" style=\"margin-top:12px;height:170px;position:relative\"><\u002Fdiv>\n      <div class=\"legend\">\n        <span><b style=\"background:var(--text)\"><\u002Fb>Exchange traffic vs expected<\u002Fspan>\n        <span><b style=\"background:var(--amb)\"><\u002Fb>Client connection attempts<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"tiles\">\n      <div class=\"tile\"><div class=\"eyebrow\">Mail traffic<\u002Fdiv><div class=\"v\" id=\"vTraffic\">0%<\u002Fdiv><div class=\"n\">vs expected · Kentik<\u002Fdiv><\u002Fdiv>\n      <div class=\"tile\"><div class=\"eyebrow\">Connections<\u002Fdiv><div class=\"v\" id=\"vConn\">0%<\u002Fdiv><div class=\"n\">retry pressure vs expected · Kentik<\u002Fdiv><\u002Fdiv>\n      <div class=\"tile\"><div class=\"eyebrow\">Delayed mail held<\u002Fdiv><div class=\"v\" id=\"vQueue\">0.0 h<\u002Fdiv><div class=\"n\">≈ hours of normal mail flow queued · derived estimate<\u002Fdiv><\u002Fdiv>\n      <div class=\"tile\"><div class=\"eyebrow\">Countries reporting<\u002Fdiv><div class=\"v\" id=\"vCountries\">0<\u002Fdiv><div class=\"n\">Downdetector<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"sec\">\n      <div class=\"eyebrow\">Delivery &amp; delay<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px;margin-top:10px;font-size:12px;line-height:1.45\">\n        <div style=\"display:flex;justify-content:space-between;gap:10px\"><span style=\"color:var(--muted)\">Mailbox access methods failing<\u002Fspan><span style=\"font-family:var(--mono);text-align:right\">OWA · MAPI · EAS · REST<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;gap:10px\"><span style=\"color:var(--muted)\">Microsoft responses at trough<\u002Fspan><span style=\"font-family:var(--mono)\">~27% of normal<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;gap:10px\"><span style=\"color:var(--muted)\">Exchange median TTFB<\u002Fspan><span style=\"font-family:var(--mono)\">10 → 90 ms<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;gap:10px\"><span style=\"color:var(--muted)\">Depressed traffic window<\u002Fspan><span style=\"font-family:var(--mono)\">17h 45m<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;gap:10px\"><span style=\"color:var(--muted)\">Customer impact (Microsoft)<\u002Fspan><span style=\"font-family:var(--mono)\">16:20 → 16:10 · 23h 50m<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;gap:10px\"><span style=\"color:var(--muted)\">Peak gateway servers unresponsive<\u002Fspan><span style=\"font-family:var(--mono)\">&gt;80%<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;gap:10px\"><span style=\"color:var(--muted)\">Email timeout window<\u002Fspan><span style=\"font-family:var(--mono)\" id=\"vTimeout\">standard<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;gap:10px\"><span style=\"color:var(--muted)\">Peak Downdetector reports<\u002Fspan><span style=\"font-family:var(--mono)\">19,650 / min<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"sec\">\n      <div class=\"eyebrow\">Root cause · preliminary PIR, 15 Nov<\u002Fdiv>\n      <ol style=\"margin:10px 0 0;padding-left:18px;font-size:12px;line-height:1.5;display:flex;flex-direction:column;gap:6px;text-wrap:pretty\">\n        <li>A fix deployed to networking gateway servers from July carried a latent Windows defect: lock contention exhausted CPU and memory under certain traffic patterns, worst on newer many-core hardware.<\u002Fli>\n        <li>~15h before impact, Teams traffic moved onto the gateway shared with Exchange Online.<\u002Fli>\n        <li>~14% of gateway capacity was already offline for an unrelated reason.<\u002Fli>\n        <li>Automatic failover spread the fault across regions in under 2h; restarted servers failed again as queued traffic returned.<\u002Fli>\n      <\u002Fol>\n      <p class=\"sub\" style=\"margin-top:10px;font-size:12px\">No malicious activity. No tenant changes required. Repair items due 20 Nov; SLA credit claims close 31 Dec 2026.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"sec\">\n      <div class=\"eyebrow\">Exchange sites by traffic origin · Kentik<\u002Fdiv>\n      <div class=\"dcgrid\" id=\"dcgrid\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"sec\" style=\"border-bottom:0\">\n      <div class=\"eyebrow\">Sources<\u002Fdiv>\n      <p class=\"sub\" style=\"margin-top:8px;font-size:11px\">Microsoft 365 Status (EX1550543, MO1550821); Kentik &amp; Cloudflare Radar network data via <a href=\"https://ppc.land/microsofts-outlook-is-back-and-it-brought-18-hours-of-mail-with-it/\" target=\"_blank\">PPC Land<\u002Fa>; Downdetector via <a href=\"https://edition.cnn.com/2026/11/12/business/live-news/microsoft-global-outage-intl-hnk\" target=\"_blank\">CNN<\u002Fa>, <a href=\"https://www.itv.com/news/2026-11-13/widespread-microsoft-outage-continues-to-impact-outlook-and-other-apps\" target=\"_blank\">ITV<\u002Fa>, <a href=\"https://www.aljazeera.com/news/2026/11/13/microsoft-hit-by-global-outages-what-happened-and-why\" target=\"_blank\">Al Jazeera<\u002Fa>, <a href=\"https://www.abc.net.au/news/2026-11-13/microsoft-outage-affects-users-worldwide/107381050\" target=\"_blank\">ABC AU<\u002Fa>; <a href=\"https://www.systemdesign.academy/explained/microsoft-365-outage\" target=\"_blank\">incident timeline<\u002Fa>; resolution &amp; cause via <a href=\"https://deployflow.co/blog/microsoft-outage/\" target=\"_blank\">Deployflow<\u002Fa> (preliminary PIR), <a href=\"https://www.macrumors.com/2026/11/13/microsoft-365-outage-resolving/\" target=\"_blank\">MacRumors<\u002Fa>, <a href=\"https://www.epifive.com/blog/microsoft-365-outage-november-2026-what-to-do\" target=\"_blank\">Epifive<\u002Fa>, <a href=\"https://www.nsao.com/post/microsoft-365-outage-resolved-final-update-and-incident-timeline-november-14-2026\" target=\"_blank\">NSAO<\u002Fa>, <a href=\"https://webhosting.today/2026/11/16/microsoft-points-to-a-latent-bug-behind-its-day-long-outlook-outage/\" target=\"_blank\">webhosting.today<\u002Fa>. Volume curves are interpolated between published data points; queued-mail figure is derived. Updated 16 Nov 2026: resolved; final PIR pending.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Faside>\n\n  <div class=\"bottom\">\n    <button class=\"pbtn\" id=\"play\" aria-label=\"Play\"><\u002Fbutton>\n    <div class=\"track\" id=\"track\"><svg id=\"tsvg\"><\u002Fsvg><\u002Fdiv>\n    <div style=\"display:flex;gap:6px;flex:none\">\n      <button class=\"chip\" data-speed=\"0.5\">½×<\u002Fbutton><button class=\"chip\" data-speed=\"1\">1×<\u002Fbutton><button class=\"chip\" data-speed=\"2\">2×<\u002Fbutton><button class=\"chip\" data-speed=\"4\">4×<\u002Fbutton>\n      <button class=\"chip on\" id=\"follow\" title=\"Globe follows latest event\">Follow<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script>\n(function(){\nconst COL={out:'#f07445',rec:'#3fc2a6',amb:'#e0b04a',text:'#ebe8e1',muted:'#98a0aa'};\nconst T0=14,T1=56, START=16.283, IMPACT_END=40.167, RESOLVED=52.283;\ncons age.classList.add('drag');stage.setPointerCapture(e.pointerId);});\nstage.addEventListener('pointermove',e=>{\n if(dragging){const dx=e.clientX-px,dy=e.clientY-py;moved+=Math.abs(dx)+Math.abs(dy);px=e.clientX;py=e.clientY;rot[0]+=dx*0.28/zoom;rot[1]=Math.max(-80,Math.min(80,rot[1]-dy*0.28/zoom));lastInteract=performance.now();hideTip();return;}\n hover(e);\n});\nstage.addEventListener('pointerup',e=>{dragging=false;stage.classList.remove('drag');if(moved<5)hover(e,true);});\nstage.addEventListener('pointerleave',()=>{if(!dragging)hideTip();});\nstage.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(0.7,Math.min(3.2,zoom*Math.exp(-e.deltaY*0.0012)));lastInteract=performance.now();},{passive:false});\n\nconst tip=document.getElementById('tip');let tipSticky=false;\nfunction hideTip(){tip.style.opacity=0;tipSticky=false;}\nfunction hover(e,click){\n const r=stage.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;\n let best=null,bd=14;for(const h of hits){const d=Math.hypot(h.x-x,h.y-y);if(d<bd){bd=d;best=h;}}\n if(!best){if(!tipSticky||click)hideTip();return;}\n if(click)tipSticky=true;\n let html='';\n if(best.kind==='country'){const c=best.c,recv=t>=c.rec;html=`<div class=\"h\">${c.name}<\u002Fdiv><div class=\"m\" style=\"color:${recv?COL.rec:COL.out}\">${recv?'Recovering':'Impacted'} · since ${hm(c.on)} UTC<\u002Fdiv>${c.note}`;}\n else if(best.kind==='dc'){const d=best.d;html=`<div class=\"h\">${d.name} · Exchange site<\u002Fdiv><div class=\"m\" style=\"color:${DCCOL[best.st]}\">${DCLBL[best.st]}<\u002Fdiv>${d.note}. Traffic geolocated by Kentik.`;}\n else if(best.kind==='origin'){html=`<div class=\"h\">${ORIGIN.name}<\u002Fdiv><div class=\"m\" style=\"color:${COL.out}\">Origin · 16:17 UTC Thu<\u002Fdiv>${ORIGIN.note}`;}\n else {html=`<div class=\"h\">${SPARED.name}<\u002Fdiv><div class=\"m\">Largely spared<\u002Fdiv>${SPARED.note}`;}\n tip.innerHTML=html;tip.style.opacity=1;\n const tx=Math.min(x+16,W-290),ty=Math.min(y+16,H-140);tip.style.left=tx+'px';tip.style.top=ty+'px';\n}\nfunction focusOn(lon,lat){rot[0]=-lon;rot[1]=Math.max(-50,Math.min(50,-lat*0.8));lastInteract=performance.now();}\n\n// ---------- UI\nconst feed=document.getElementById('feed');let feedN=-1,feedCur=-1;\nconst typeCol={impact:COL.out,signal:COL.amb,msft:COL.text,recovery:COL.rec};\nfunction renderFeed(){\n const vis=EVENTS.map((e,i)=>[e,i]).filter(([e])=>e.h<=t).reverse();\n feed.innerHTML=vis.length?vis.map(([e,i],k)=>`<div class=\"ev${k===0?' cur':''}\" data-i=\"${i}\"><div class=\"t\">${hm(e.h)}${e.h>=48?'<br>Sat':e.h>=24?'<br>Fri':'<br>Thu'}<\u002Fdiv><div><div class=\"ti\"><i style=\"background:${typeCol[e.type]}\"><\u002Fi>${e.title}<\u002Fdiv><div class=\"d\">${e.d}<\u002Fdiv><div class=\"s\">${e.src}<\u002Fdiv><\u002Fdiv><\u002Fdiv>`).join(''):`<div class=\"ev\"><div class=\"t\">—<\u002Fdiv><div class=\"d\">Press play to replay the incident from 14:00 UTC Thursday.<\u002Fdiv><\u002Fdiv>`;\n}\nfeed.addEventListener('click',e=>{const el=e.target.closest('.ev[data-i]');if(!el)return;const ev=EVENTS[+el.dataset.i];t=ev.h;if(ev.loc)focusOn(ev.loc[0],ev.loc[1]);});\n\nconst dcgrid=document.getElementById('dcgrid');\ndcgrid.innerHTML=DCS.map((d,i)=>`<div class=\"dc\" data-i=\"${i}\"><i><\u002Fi><span>${d.name}<\u002Fspan><\u002Fdiv>`).join('');\ndcgrid.addEventListener('click',e=>{const el=e.target.closest('.dc');if(el){const d=DCS[+el.dataset.i];focusOn(d.lon,d.lat);}});\nconst dcEls=[...dcgrid.querySelectorAll('.dc i')];\n\nconst $=id=>document.getElementById(id);\nconst banner=$('banner');\nfunction updateUI(){\n $('clock').textContent=fmt(t)+' UTC';$('clockEt').textContent=etFmt(t);$('clockRel').textContent=rel(t)+' from EX1550543';\n const n=EVENTS.filter(e=>e.h<=t).length;if(n!==feedN){feedN=n;renderFeed();}\n const tr=interp(TRAFFIC,t),cn=interp(CONN,t);\n $('vTraffic').textContent=(tr>0?'+':'')+Math.round(tr)+'%';$('vTraffic').style.color=tr<-5?COL.out:tr>5?COL.rec:COL.text;\n $('vConn').textContent=(cn>0?'+':'')+Math.round(cn)+'%';$('vConn').style.color=cn>5?COL.amb:COL.text;\n $('vQueue').textContent=queueAt(t).toFixed(1)+' h';\n $('vCountries').textContent=countriesAt(t);\n $('vTimeout').textContent=t>=36?'extended to 48 h':'standard';$('vTimeout').style.color=t>=36?COL.rec:'';\n DCS.forEach((d,i)=>dcEls[i].style.background=DCCOL[dcState(d,t)]);\n let st,col;if(t<START){st='Pre-incident · services nominal';col='#5d6672';}else if(t<17.583){st='Exchange mailbox access failing · Americas';col=COL.out;}else if(t<35.333){st='Global degradation · mail delayed / undeliverable';col=COL.out;}else if(t<IMPACT_END){st='Recovering · queued mail draining';col=COL.rec;}else if(t<RESOLVED){st='Impact ended · backlog being verified';col=COL.rec;}else{st='Resolved · service restored';col=COL.rec;}\n banner.querySelector('i').style.background=col;banner.querySelector('span').textContent=st;\n if(cursorT){const x=xs(t);cursorT.attr('x1',x).attr('x2',x);}\n if(cursorC){const x=xc(t);cursorC.attr('x1',x).attr('x2',x);dotT.attr('cx',x).attr('cy',yc(tr));dotC.attr('cx',x).attr('cy',yc(cn));}\n}\n\n// timeline\nconst track=$('track'),tsvg=d3.select('#tsvg');let xs=null,cursorT=null;\nfunction drawTimeline(){\n const w=track.clientWidth,h=track.clientHeight;tsvg.selectAll('*').remove();\n xs=d3.scaleLinear().domain([T0,T1]).range([0,w]);\n const ya=d3.scaleLinear().domain([-90,25]).range([h-16,6]);\n tsvg.append('path').datum(d3.range(T0,T1+0.01,0.1)).attr('d',d3.area().x(v=>xs(v)).y0(ya(0)).y1(v=>ya(interp(TRAFFIC,v)))).attr('fill','rgba(240,116,69,0.12)');\n tsvg.append('line').attr('x1',0).attr('x2',w).attr('y1',ya(0)).attr('y2',ya(0)).attr('stroke','#3a424e');\n for(let hh=T0;hh<=T1;hh+=2){const x=xs(hh);tsvg.append('line').attr('x1',x).attr('x2',x).attr('y1',h-14).attr('y2',h-10).attr('stroke','#4a525d');\n  if(w>1100||hh%4===0)tsvg.append('text').attr('x',x).attr('y',h-1).attr('text-anchor','middle').attr('font-family','IBM Plex Mono').attr('font-size',10).attr('fill','#6f7782').text(String(hh%24).padStart(2,'0'));}\n const xm=xs(24);tsvg.append('line').attr('x1',xm).attr('x2',xm).attr('y1',0).attr('y2',h-14).attr('stroke','#4a525d').attr('stroke-dasharray','2 3');\n tsvg.append('text').attr('x',4).attr('y',10).attr('font-family','IBM Plex Mono').attr('font-size',10).attr('fill','#98a0aa').text('THU 12 NOV UTC');\n tsvg.append('text').attr('x',xm+4).attr('y',10).attr('font-family','IBM Plex Mono').attr('font-size',10).attr('fill','#98a0aa').text('FRI 13 NOV');\n const xsat=xs(48);tsvg.append('line').attr('x1',xsat).attr('x2',xsat).attr('y1',0).attr('y2',h-14).attr('stroke','#4a525d').attr('stroke-dasharray','2 3');tsvg.append('text').attr('x',xsat+4).attr('y',10).attr('font-family','IBM Plex Mono').attr('font-size',10).attr('fill','#98a0aa').text('SAT 14 NOV');\n EVENTS.forEach(e=>tsvg.append('circle').attr('cx',xs(e.h)).attr('cy',ya(0)).attr('r',3).attr('fill',typeCol[e.type]).append('title').text(hm(e.h)+' — '+e.title));\n cursorT=tsvg.append('line').attr('y1',0).attr('y2',h-12).attr('stroke','#ebe8e1').attr('stroke-width',2);\n}\nlet scrubbing=false;\nconst scrubTo=e=>{const r=track.getBoundingClientRect();t=Math.max(T0,Math.min(T1,xs.invert(e.clientX-r.left)));};\ntrack.addEventListener('pointerdown',e=>{scrubbing=true;track.setPointerCapture(e.pointerId);scrubTo(e);});\ntrack.addEventListener('pointermove',e=>{if(scrubbing)scrubTo(e);});\ntrack.addEventListener('pointerup',()=>scrubbing=false);\n\n// chart\nconst chartEl=$('chart');let xc=null,yc=null,cursorC=null,dotT=null,dotC=null;\nfunction drawChart(){\n const w=chartEl.clientWidth,h=chartEl.clientHeight,m={l:34,r:6,t:8,b:20};chartEl.innerHTML='';\n const svg=d3.select(chartEl).append('svg').attr('width',w).attr('height',h);\n xc=d3.scaleLinear().domain([T0,T1]).range([m.l,w-m.r]);yc=d3.scaleLinear().domain([-100,80]).range([h-m.b,m.t]);\n [-80,-40,0,40,80].forEach(v=>{svg.append('line').attr('x1',m.l).attr('x2',w-m.r).attr('y1',yc(v)).attr('y2',yc(v)).attr('stroke',v===0?'#4a525d':'#232a33');\n  svg.append('text').attr('x',m.l-6).attr('y',yc(v)+3).attr('text-anchor','end').attr('font-family','IBM Plex Mono').attr('font-size',9).attr('fill','#6f7782').text((v>0?'+':'')+v+'%');});\n [16,24,32,40,48,56].forEach(v=>svg.append('text').attr('x',xc(v)).attr('y',h-6).attr('text-anchor','middle').attr('font-family','IBM Plex Mono').attr('font-size',9).attr('fill','#6f7782').text(String(v%24).padStart(2,'0')+':00'));\n const xs2=d3.range(T0,T1+0.01,0.05);\n svg.append('path').datum(xs2).attr('d',d3.area().x(v=>xc(v)).y0(yc(0)).y1(v=>yc(Math.min(0,interp(TRAFFIC,v))))).attr('fill','rgba(240,116,69,0.22)');\n svg.append('path').datum(xs2).attr('d',d3.area().x(v=>xc(v)).y0(yc(0)).y1(v=>yc(Math.max(0,interp(TRAFFIC,v))))).attr('fill','rgba(63,194,166,0.35)');\n svg.append('path').datum(xs2).attr('d',d3.line().x(v=>xc(v)).y(v=>yc(interp(CONN,v)))).attr('fill','none').attr('stroke',COL.amb).attr('stroke-width',1.3);\n svg.append('path').datum(xs2).attr('d',d3.line().x(v=>xc(v)).y(v=>yc(interp(TRAFFIC,v)))).attr('fill','none').attr('stroke',COL.text).attr('stroke-width',1.6);\n const ann=(x,y,txt,anchor='start')=>svg.append('text').attr('x',x).attr('y',y).attr('text-anchor',anchor).attr('font-family','IBM Plex Mono').attr('font-size',9).attr('fill','#98a0aa').text(txt);\n ann(xc(26),yc(-85)+12,'−85% · mail not flowing','middle');\n ann(xc(37.4),yc(19)-6,'+19% backlog','middle');\n ann(xc(18.3)+4,yc(70)+3,'+70% retries');\n cursorC=svg.append('line').attr('y1',m.t).attr('y2',h-m.b).attr('stroke','#ebe8e1').attr('stroke-opacity',0.6);\n dotC=svg.append('circle').attr('r',3).attr('fill',COL.amb);dotT=svg.append('circle').attr('r',3.5).attr('fill',COL.text);\n}\n\n// controls\nconst playBtn=$('play');\nfunction setPlaying(p){playing=p;playBtn.innerHTML=p?'<svg width=\"14\" height=\"14\"><rect x=\"2\" y=\"1\" width=\"3.5\" height=\"12\" fill=\"#ebe8e1\"/><rect x=\"8.5\" y=\"1\" width=\"3.5\" height=\"12\" fill=\"#ebe8e1\"/><\u002Fsvg>':'<svg width=\"14\" height=\"14\"><path d=\"M3 1 L13 7 L3 13 Z\" fill=\"#ebe8e1\"/><\u002Fsvg>';playBtn.setAttribute('aria-label',p?'Pause':'Play');}\nplayBtn.onclick=()=>{if(!playing&&t>=T1-0.01)t=T0;setPlaying(!playing);};\nconst chips=[...document.querySelectorAll('[data-speed]')];\nconst setSpeed=s=>{speed=s;chips.forEach(c=>c.classList.toggle('on',+c.dataset.speed===s));};\nchips.forEach(c=>c.onclick=()=>setSpeed(+c.dataset.speed));setSpeed(1);\n$('follow').onclick=e=>{follow=!follow;e.currentTarget.classList.toggle('on',follow);};\nwindow.addEventListener('keydown',e=>{\n if(e.target.closest('input,textarea'))return;\n if(e.code==='Space'){e.preventDefault();playBtn.click();}\n if(e.key==='ArrowRight'){const n=EVENTS.find(ev=>ev.h>t+0.001);if(n){t=n.h;lastInteract=0;}}\n if(e.key==='ArrowLeft'){const p=[...EVENTS].reverse().find(ev=>ev.h<t-0.001);if(p){t=p.h;lastInteract=0;}}\n});\nsetPlaying(false);drawTimeline();drawChart();\n{const e=curEvent();if(e&&e.loc){rot[0]=-e.loc[0];rot[1]=-e.loc[1]*0.8;}}\nrequestAnimationFrame(frame);\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
